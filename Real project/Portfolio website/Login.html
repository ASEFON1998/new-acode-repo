<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login account</title>
</head>
<style>
  body{
    background: blue;
    display: grid;
    place-items: center;
  }
  .box{
    height: 340px;
    width: 230px;
    background: rgba(235,235,245,0.9);
    border: 2px solid black;
    border-radius: 50px;
  }
</style>
<body>
  <div class="box">
   <form class="container">
       <h1>Login</h1>
       <input type="text" placeholder="Name or E-mail" required>
       <input type="password" placeholder="Password" required>
       <button>Login</button>
   
   </form>   
  
  </div>
</body>
</html>
