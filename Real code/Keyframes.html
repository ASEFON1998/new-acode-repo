<!DOCTYPE html>
<html>
  <head>
    <title>KEYFRAMES</title>
  </head>
  <style>
  body{
    background:#282828;
    display: block;
    align-items: center;
    gap: 2;
  }
    .container{
      width:400px;
      height:400px;
      border:3px solid #4bbd1b;
    }
    .container2{
      width:400px;
      height:400px;
      border:3px solid #e6dd17;
      border-radius:50%;
      animation:Orbit 4s linear infinite;
    }
    .box{
      width:100px;
      height:100px;
      background:#ff0e85;
      animation:moveBox 3s linear infinite;
    }
    .box2{
      width:100px;
      height:100px;
      background:#f2810a;
      border-radius:50%;
    }
    @keyframes moveBox{
      0%, 100%{
        transform:translate(0, 0);
      }
      25%{
        transform:translate(300px, 0);
      }
      50%{
        transform:translate(300px, 300px);
      }
      75%{
        transform:translate(0, 300px);
      }
    }
    
    @keyframes Orbit{
      from{
        transform:rotate(0deg);
      }
      to{
        transform:rotate(360deg);
      }
    }
  </style>
  <body>
    <div class="container">
      <div class="box"></div>
    </div>
    
    <div class="container2">
      <div class="box2"></div>
    </div>
  </body>
</html>
